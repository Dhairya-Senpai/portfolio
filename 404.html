<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Redirect to index.html and preserve the path
      const path = window.location.pathname;
      const redirect = path + window.location.search;
      window.location.replace('/' + redirect.split('/').splice(1).join('/'));
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
